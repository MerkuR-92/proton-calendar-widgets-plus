apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.gitlab.arturbosch.detekt'

detekt {
    failFast = false
    config = files("$projectDir/config/detekt/detekt.yml")
    reports {
        xml {
            enabled = false
        }
        html {
            enabled = true
        }
        txt {
            enabled = false
        }
        custom {
            reportId = "DetektQualityOutputReport"
            destination = file("build/reports/detekt.json")
        }
    }
}

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"
    ndkVersion "20.0.5594570"
    
    defaultConfig {
        applicationId "me.proton.android.calendar"
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 5
        versionName "0.2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //signingConfig signingConfigs.debug TODO
    }

    signingConfigs {
//        debug { TODO
//            storeFile file('/Users/path-to-keystore')
//            storePassword '123456'
//            keyAlias 'debug-key'
//            keyPassword '123456'
//        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.0.9'

    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.version.kotlin}"
    implementation 'androidx.core:core-ktx:1.3.0'
//    implementation 'androidx.appcompat:appcompat:1.1.0'
//    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation "androidx.constraintlayout:constraintlayout:${rootProject.ext.version.constraint_layout}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.1.0"
    implementation "androidx.viewpager2:viewpager2:${rootProject.ext.version.viewpager2}"
//    implementation 'androidx.navigation:navigation-fragment:2.2.1'
//    implementation 'androidx.navigation:navigation-ui:2.2.1'
    implementation "androidx.navigation:navigation-fragment-ktx:${rootProject.ext.version.navigation}"
    implementation "androidx.navigation:navigation-ui-ktx:${rootProject.ext.version.navigation}"

    implementation "androidx.lifecycle:lifecycle-extensions:${rootProject.ext.version.androidx}"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:${rootProject.ext.version.androidx}"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:${rootProject.ext.version.androidx}"
//    For LifecycleScope, use androidx.lifecycle:lifecycle-runtime-ktx:2.2.0-alpha01 or higher.
//    For liveData, use androidx.lifecycle:lifecycle-livedata-ktx:2.2.0-alpha01 or higher.
    //noinspection GradleDependency
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.version.work}"

//    implementation "androidx.room:room-coroutines:2.2.4"
    implementation "androidx.room:room-runtime:${rootProject.ext.version.room}"
    kapt "androidx.room:room-compiler:${rootProject.ext.version.room}"
    implementation "androidx.room:room-ktx:${rootProject.ext.version.room}"

    implementation "org.koin:koin-android:${rootProject.ext.version.koin}"
    implementation "org.koin:koin-android-viewmodel:${rootProject.ext.version.koin}"

//    implementation 'com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:0.4.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.version.retrofit}"
    implementation 'com.squareup.retrofit2:converter-gson:2.7.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.2"
//    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"
    implementation "com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.4.0'

    implementation "com.jakewharton.timber:timber:${rootProject.ext.version.timber}"


//    implementation "com.google.dagger:dagger-android:${rootProject.ext.dagger_version}"
//    kapt "com.google.dagger:dagger-compiler:${rootProject.ext.dagger_version}"
//    kapt "com.google.dagger:dagger-android-processor:${rootProject.ext.dagger_version}"

    implementation "androidx.security:security-crypto:${rootProject.ext.version.security}"
    implementation "com.google.crypto.tink:tink-android:1.3.0" // it's included in security-crypto

    implementation "at.favre.lib:bcrypt:0.9.0"
//    implementation "org.mnode.ical4j:ical4j:${rootProject.ext.version.ical}"
    implementation "net.sf.biweekly:biweekly:${rootProject.ext.version.biweekly}"

    detekt 'io.gitlab.arturbosch.detekt:detekt-formatting:1.9.1'
    detekt 'io.gitlab.arturbosch.detekt:detekt-cli:1.9.1'
    detektPlugins 'pm.algirdas.detekt:codeanalysis:0.3.3'
    detektPlugins 'io.gitlab.arturbosch.detekt:detekt-formatting:1.9.1'

    androidTestImplementation 'androidx.test:core:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    testImplementation 'com.willowtreeapps.assertk:assertk-jvm:0.21'
    testImplementation "io.mockk:mockk:1.9.3" // TODO downgrade to 1.9.2 in case of problems with tests
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.5.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.5.0'

    testImplementation "org.koin:koin-test:${rootProject.ext.version.koin}"

}
