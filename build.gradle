// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        version = [
                "kotlin": "1.6.21",
                "coroutine": "1.5.2",
                "retrofit": "2.7.1",
                "room": "2.4.1",
                "androidx": "2.5.1",
                "navigation": "2.5.3",
                "work": "2.6.0",
                "security": "1.1.0-alpha03",
                "splashscreen": "1.0.0",
                "timber": "5.0.1",
                "koin": "2.1.6",
                "biweekly": "0.6.5",
                "constraint_layout": "2.1.0",
                "viewpager2": "1.1.0-alpha01",
                "material": "1.5.0",
                "androidx_test": "1.4.0",
                "serialization": "1.3.3",
                "assisted_inject" : "0.6.0",
                "hilt_android": "2.44",
                "hilt_androidx": "1.0.0",
                "proton_core": "9.4.1",
        ]
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.version.kotlin}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:${rootProject.ext.version.navigation}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.19.0"
        classpath "com.google.dagger:hilt-android-gradle-plugin:${rootProject.ext.version.hilt_android}"
        classpath "org.jacoco:org.jacoco.core:0.8.7"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
