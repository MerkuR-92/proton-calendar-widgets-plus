// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        version = [
                "kotlin": "1.4.10",
                "coroutine": "1.3.7",
                "retrofit": "2.7.1",
                "room": "2.2.5",
                "androidx": "2.2.0",
                "navigation": "2.3.0",
                "work": "2.3.2",
                "security": "1.1.0-alpha02",
                "timber": "4.7.1",
                "koin": "2.1.2",
                "biweekly": "0.6.4",
                "constraint_layout": "2.0.1",
                "viewpager2": "1.1.0-alpha01",
                "material": "1.2.1",
                "androidx_test": "1.3.0",
                "serialization": "1.0.1",
                "assisted_inject" : "0.6.0",
                "hilt_android": "2.29.1-alpha",
                "hilt_androidx": "1.0.0-alpha02",

                "proton_core_account": "0.1.3",
                "proton_core_account_manager": "0.1.4",
                "proton_core_account_manager_dagger": "0.1.2",
                "proton_core_auth": "0.2.3",
                "proton_core_human_verification": "0.2.4",
                "proton_core_data": "0.1.2",
                "proton_core_domain": "0.2.4",
                "proton_core_presentation": "0.5",
                "proton_core_networking": "0.3.6",
                "proton_core_util_kotlin": "0.2.4"
        ]
    }

    repositories {
        google()
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.version.kotlin}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:${rootProject.ext.version.navigation}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.9.1"
        classpath "com.google.dagger:hilt-android-gradle-plugin:${rootProject.ext.version.hilt_android}"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url = "https://kotlin.bintray.com/kotlinx" }
        maven { url = "https://dl.bintray.com/proton/Core-publishing" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
