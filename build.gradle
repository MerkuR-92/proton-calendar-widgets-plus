// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        version = [
                "kotlin": "1.5.30",
                "coroutine": "1.5.2",
                "retrofit": "2.7.1",
                "room": "2.3.0",
                "androidx": "2.4.0-alpha03",
                "navigation": "2.3.3",
                "work": "2.6.0",
                "security": "1.1.0-alpha03",
                "timber": "5.0.1",
                "koin": "2.1.2",
                "biweekly": "0.6.5",
                "constraint_layout": "2.1.0",
                "viewpager2": "1.1.0-alpha01",
                "material": "1.4.0",
                "androidx_test": "1.4.0",
                "serialization": "1.3.1",
                "assisted_inject" : "0.6.0",
                "hilt_android": "2.38.1",
                "hilt_androidx": "1.0.0",
                "cookie_store": "1.3.5",

                "proton_core_crypto": "1.16",
                "proton_core_account": "1.15.2",
                "proton_core_account_manager": "1.16.2",
                "proton_core_auth": "1.18",
                "proton_core_user": "1.18",
                "proton_core_user_settings": "1.18.2",
                "proton_core_key": "1.16.1",
                "proton_core_human_verification": "1.16.3",
                "proton_core_data": "1.15",
                "proton_core_data_room": "1.16",
                "proton_core_domain": "1.18",
                "proton_core_presentation": "1.18.3",
                "proton_core_payment": "1.17.3",
                "proton_core_plan": "1.18.1",
                "proton_core_country": "1.16.2",
                "proton_core_networking": "1.15.7",
                "proton_core_util_kotlin": "1.15.2",
                "proton_core_mail_message": "1.15.1",
                "proton_core_mail_settings": "1.18",
                "proton_core_contact": "1.18"
        ]
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.version.kotlin}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:${rootProject.ext.version.navigation}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.14.2"
        classpath "com.google.dagger:hilt-android-gradle-plugin:${rootProject.ext.version.hilt_android}"
        classpath "org.jacoco:org.jacoco.core:0.8.7"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        maven { url "https://plugins.gradle.org/m2/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
