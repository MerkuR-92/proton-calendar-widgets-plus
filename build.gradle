// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        version = [
                "kotlin": "1.4.10",
                "coroutine": "1.3.7",
                "retrofit": "2.7.1",
                "room": "2.2.5",
                "androidx": "2.2.0",
                "navigation": "2.3.0",
                "work": "2.3.2",
                "security": "1.1.0-alpha02",
                "timber": "4.7.1",
                "koin": "2.1.2",
                "biweekly": "0.6.3",
                "constraint_layout": "2.0.1",
                "viewpager2": "1.1.0-alpha01",
                "material": "1.2.1",
                "androidx_test": "1.3.0"
        ]
    }

    repositories {
        google()
        jcenter() 
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0-rc02'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.version.kotlin}"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:${rootProject.ext.version.navigation}"
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.9.1"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
